pre-commit:
  parallel: true
  jobs:
    - name: ruff
      glob: "backend/**/*.py"
      run: backend/.venv/bin/ruff check --fix {staged_files} && backend/.venv/bin/ruff format {staged_files}
      stage_fixed: true
    - name: prettier
      root: frontend/
      glob: "*.{ts,tsx,css,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
