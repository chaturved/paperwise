name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: pyright --pythonpath "$(which python)" backend/src
        working-directory: .
      - name: Run tests
        run: pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paperwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/paperwise
      JWT_SECRET_KEY: ci-only
      SESSION_SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Enable pgvector
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d paperwise -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Apply every migration to an empty database
        run: alembic upgrade head
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
