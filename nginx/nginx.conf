events {}

http {
  server {
    listen 80;
    server_name paperwise.chaturved-sumanth-lakkaraju.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name paperwise.chaturved-sumanth-lakkaraju.com;

    ssl_certificate /etc/letsencrypt/live/paperwise.chaturved-sumanth-lakkaraju.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperwise.chaturved-sumanth-lakkaraju.com/privkey.pem;

    location /api/ {
      client_max_body_size 55m;  # Pro allows 50 MB files; nginx's default of 1 MB rejected larger uploads
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass http://backend:8000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
